[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
cpal = "0.18.2"
tokio = { version = "1.53.2", features = ["full"] }
whisper-rs = { version = "0.16.0", features = ["log_backend"] }
reqwest = { version = "0.13.5", features = ["json"] }
chrono = "0.4.45"
which = "8.0.6"
dotenvy = "0.15.7"
dirs = "7.0.0"
sysinfo = "0.38.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v4"] }
async-trait = "0.1.92"
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# whisper.cpp's C/C++ inference kernels are compiled by whisper-rs-sys's
# build script, which otherwise inherits the dev profile's -O0. That makes
# every Whisper transcription (even on the tiny model) an order of
# magnitude slower in `tauri dev` than a release build -- this is the
# actual cause of multi-second STT turnaround observed in dev, not a model
# or VAD problem. Force just this dependency to build optimized regardless
# of profile; Rust-side rebuild-on-change in the rest of the app stays fast.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
